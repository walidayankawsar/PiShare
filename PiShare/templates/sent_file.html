<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PiShare • Send & Receive Files via QR</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<style>
:root {
  --primary: #6366f1;
  --primary-dark: #4f46e5;
  --primary-light: #818cf8;
  --bg: #f8fafc;
  --card: #ffffff;
  --text: #1e293b;
  --text-muted: #64748b;
}
body {
  background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
  color: var(--text);
  min-height: 100vh;
  font-family: system-ui, -apple-system, sans-serif;
  padding-bottom: 3rem;
}
.header {
  background: var(--primary);
  color: white;
  padding: 2.5rem 1rem 4rem;
  text-align: center;
}
.container-main { max-width: 860px; margin: -3.5rem auto 0; padding: 0 1rem; }
.card { background: var(--card); border: none; border-radius: 1rem; box-shadow: 0 10px 30px rgba(0,0,0,0.08); margin-bottom: 2rem; }
.card-header { background: var(--primary); color: white; padding: 1.25rem 1.5rem; font-weight: 600; font-size: 1.25rem; }
.btn-primary { background: var(--primary); border: none; padding: 0.6rem 1.5rem; font-weight: 600; border-radius: 0.75rem; }
.btn-primary:hover { background: var(--primary-dark); }
.history-list .list-group-item { padding: 1rem 1.25rem; border-left: 4px solid var(--primary); margin-bottom: 0.75rem; border-radius: 0.5rem; }
.file-meta { font-size: 0.85rem; color: var(--text-muted); }
footer { text-align: center; color: #94a3b8; margin-top: 4rem; font-size: 0.9rem; }
</style>
</head>
<body>

<header class="header">
<h1 class="display-4 fw-bold mb-2">PiShare</h1>
<p class="lead fs-4 opacity-90">Send files between devices using only QR codes</p>
<p class="opacity-75">• No login required • Just your camera • Auto delete after 10 minutes</p>
</header>

<div class="container-main">
  <div class="card">
    <div class="card-header">File History • Your Files</div>
    <div class="card-body p-4">
      <form id="uploadForm">
        <input type="file" id="fileInput" multiple class="form-control mb-3">
        <ul id="fileList" class="list-group mb-3"></ul>
        <button class="btn btn-primary btn-sm px-4" type="submit" disabled>Send All Files</button>
      </form>
      <div class="text-center mt-4">
        <button id="clearHistory" class="btn btn-outline-secondary btn-sm">Clear History</button>
      </div>
    </div>
  </div>
</div>

  <footer>
    <pre>
      • PiShare
      @walidayankawsar
    </pre>
  </footer>

<script>
const fileInput = document.getElementById("fileInput");
const fileList = document.getElementById("fileList");
const uploadForm = document.getElementById("uploadForm");
const clearBtn = document.getElementById("clearHistory");
const sendBtn = uploadForm.querySelector("button[type='submit']");

let selectedFiles = [];

// Initially disable send button
sendBtn.disabled = true;

// Add files
fileInput.addEventListener("change", function() {
  const newFiles = Array.from(this.files);
  newFiles.forEach(f => selectedFiles.push(f));
  renderList();
  fileInput.value = "";
  sendBtn.disabled = selectedFiles.length === 0;
});

// Render file list
function renderList() {
  fileList.innerHTML = "";
  selectedFiles.forEach((file,index) => {
    const li = document.createElement("li");
    li.className = "list-group-item d-flex justify-content-between align-items-center";
    li.innerHTML = `
      <div>
        <strong>${file.name}</strong>
        <div class="file-meta">${(file.size/1024).toFixed(1)} KB</div>
      </div>
      <button class="btn btn-sm btn-danger" onclick="removeFile(${index})">Remove</button>
    `;
    fileList.appendChild(li);
  });
}

// Remove single file
function removeFile(index) {
  selectedFiles.splice(index,1);
  renderList();
  sendBtn.disabled = selectedFiles.length === 0;
}

// Send All
uploadForm.addEventListener("submit", function(e) {
  e.preventDefault();
  if(selectedFiles.length === 0) {
    alert("Please select at least one file!");
    return;
  }

  // Simulate sending files
  const fileNames = selectedFiles.map(f => f.name).join(", ");
  alert("Files sent: " + fileNames + " ✅");

  clearAll();
});

// Clear history
clearBtn.addEventListener("click", clearAll);

function clearAll() {
  selectedFiles = [];
  fileList.innerHTML = "";
  fileInput.value = "";
  sendBtn.disabled = true;
}
</script>

</body>
</html>
