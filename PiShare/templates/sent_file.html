<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PiShare • Send File via QR</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<style>
:root {
  --primary: #6366f1;
  --primary-dark: #4f46e5;
  --card: #ffffff;
  --text: #1e293b;
  --text-muted: #64748b;
}
body {
  background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
  color: var(--text);
  min-height: 100vh;
  font-family: system-ui, -apple-system, sans-serif;
  padding-bottom: 3rem;
}
.header {
  background: var(--primary);
  color: white;
  padding: 2.5rem 1rem 4rem;
  text-align: center;
}
.container-main { max-width: 860px; margin: -3.5rem auto 0; padding: 0 1rem; }
.card { background: var(--card); border: none; border-radius: 1rem; box-shadow: 0 10px 30px rgba(0,0,0,0.08); margin-bottom: 2rem; }
.card-header { background: var(--primary); color: white; padding: 1.25rem 1.5rem; font-weight: 600; font-size: 1.25rem; }
.btn-primary { background: var(--primary); border: none; padding: 0.6rem 1.5rem; font-weight: 600; border-radius: 0.75rem; }
.btn-primary:hover { background: var(--primary-dark); }
footer { text-align: center; color: #94a3b8; margin-top: 4rem; font-size: 0.9rem; }
</style>
</head>
<body>

<header class="header">
  <h1 class="display-4 fw-bold mb-2">PiShare</h1>
  <p class="lead fs-4 opacity-90">Send a file between devices using only QR codes</p>
  <p class="opacity-75">• No login required • Just select a file • Auto delete after 10 minutes</p>
</header>
<div class="container-main">
  <div class="card">
    <div class="card-header"><a href="{% url 'connect' session_id %}" style="text-decoration: none; color: white;">• Home</a> • Upload File</div>
    <div class="card-body p-4">
      
      <div id="upload-section">
        <!-- Single File Upload Form -->
        <form id="upload-form" enctype="multipart/form-data">
          {% csrf_token %}
          <input type="file" name="file" id="file-input" required class="form-control mb-3">
          <button type="submit" class="btn btn-primary" id="upload-btn">Send File</button>
        </form>
        
        <div id="upload-status" class="mt-3" style="display: none;">
          <div class="alert alert-info">Uploading...</div>
        </div>
        
        <div id="success-message" class="mt-3" style="display: none;">
          <div class="alert alert-success">
            File uploaded successfully!
          </div>
          <a href="{% url 'receive_file' session_id %}" class="btn btn-secondary">View Received Files</a>
        </div>
      </div>
      
    </div>
  </div>
</div>

<script>
document.getElementById('upload-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const fileInput = document.getElementById('file-input');
    const file = fileInput.files[0];
    
    if (!file) {
        alert('Please select a file');
        return;
    }
    
    const formData = new FormData();
    formData.append('file', file);
    
    const uploadBtn = document.getElementById('upload-btn');
    const uploadStatus = document.getElementById('upload-status');
    const uploadSection = document.getElementById('upload-section');
    const successMsg = document.getElementById('success-message');
    
    // Show uploading status
    uploadBtn.disabled = true;
    uploadStatus.style.display = 'block';
    
    try {
        const response = await fetch(`/api/upload/{{ session_id }}/`, {
            method: 'POST',
            body: formData,
            headers: {
                'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
            }
        });
        
        const data = await response.json();
        
        if (response.ok) {
            // Show success message
            uploadStatus.style.display = 'none';
            uploadSection.style.display = 'none';
            successMsg.style.display = 'block';
        } else {
            throw new Error(data.error || 'Upload failed');
        }
    } catch (error) {
        uploadStatus.style.display = 'none';
        alert('Upload failed: ' + error.message);
        uploadBtn.disabled = false;
    }
});
</script>



<footer>
  <pre>
    • PiShare
    @walidayankawsar
  </pre>
</footer>

</body>
</html>
