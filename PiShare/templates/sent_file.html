<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PiShare • Send File via QR</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<style>
:root {
  --primary: #6366f1;
  --primary-dark: #4f46e5;
  --card: #ffffff;
  --text: #1e293b;
  --text-muted: #64748b;
}
body {
  background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
  color: var(--text);
  min-height: 100vh;
  font-family: system-ui, -apple-system, sans-serif;
  padding-bottom: 3rem;
}
.header {
  background: var(--primary);
  color: white;
  padding: 2.5rem 1rem 4rem;
  text-align: center;
}
.container-main { max-width: 860px; margin: -3.5rem auto 0; padding: 0 1rem; }
.card { background: var(--card); border: none; border-radius: 1rem; box-shadow: 0 10px 30px rgba(0,0,0,0.08); margin-bottom: 2rem; }
.card-header { background: var(--primary); color: white; padding: 1.25rem 1.5rem; font-weight: 600; font-size: 1.25rem; }
.btn-primary { background: var(--primary); border: none; padding: 0.6rem 1.5rem; font-weight: 600; border-radius: 0.75rem; }
.btn-primary:hover { background: var(--primary-dark); }
footer { text-align: center; color: #94a3b8; margin-top: 4rem; font-size: 0.9rem; }
</style>
</head>
<body>

<header class="header">
  <h1 class="display-4 fw-bold mb-2">PiShare</h1>
  <p class="lead fs-4 opacity-90">Send a file between devices using only QR codes</p>
  <p class="opacity-75">• No login required • Just select a file • Auto delete after 10 minutes</p>
</header>

<div class="container-main">
  <div class="card">
    <div class="card-header"><a href="{% url 'home'%}" style="text-decoration: none; color: white;">• Home</a> • Upload File</div>
    <div class="card-body p-4">

      <!-- Single File Upload Form -->
      <form method="POST" action="#" enctype="multipart/form-data">
          {% csrf_token %}
          <input type="file" name="file" required class="form-control mb-3">
          <button type="submit" class="btn btn-primary">Send File</button>
      </form>

    </div>
  </div>
</div>
<footer>
  <pre>
    • PiShare
    @walidayankawsar
  </pre>
</footer>

</body>
</html>
